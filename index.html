<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Re-Flect | AI Mindfulness Journal & Mood Tracker</title>
    <meta name="description" content="Re-Flect is an AI-powered mindfulness dashboard for daily journaling, mood tracking, and gaining personal insights to improve mental well-being." />
    <meta name="keywords" content="journaling, mood tracker, mindfulness, AI, mental health, self-care, reflection, gratitude" />
    <meta property="og:title" content="Re-Flect | AI Mindfulness Journal" />
    <meta property="og:description" content="Start your journey of self-discovery with Re-Flect. Track moods, journal with AI assistance, and find clarity." />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet"/>
    
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2a5e6f",
                        "secondary": "#CCAB48", 
                        "background-light": "#fafaf9",
                        "background-dark": "#232629",
                        "card-light": "#ffffff",
                        "card-dark": "#2d3135",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2d3135",
                        "accent": "#CCAB48",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "serif": ["Merriweather", "serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 15px rgba(42, 94, 111, 0.15)',
                        'float': '0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #4b5563;
        }
        
        /* Utility classes for editor */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .editor-textarea {
             min-height: 60vh;
        }
    </style>
